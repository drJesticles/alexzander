<section class="wf-section wf-section--tight c-form-newsletter-inline" data-wf-component="form-newsletter-inline">
  <div class="wf-container">
    <div class="c-form-newsletter-inline__band">
      <div class="c-form-newsletter-inline__copy">
        <span class="wf-eyebrow">Seasonal checklist</span>
        <h2 class="c-form-newsletter-inline__title">Home maintenance reminders, once a month.</h2>
        <p class="c-form-newsletter-inline__text">Gutter season, HVAC filter swaps, freeze warnings for outdoor spigots. Short, useful, and from <span data-wf-field="business.name">AAA Home Specialists</span>, not a marketing robot.</p>
      </div>
      <form class="c-form-newsletter-inline__form" data-wf-form="newsletter" action="#" method="post">
        <div class="c-form-newsletter-inline__fields">
          <div class="wf-field c-form-newsletter-inline__field">
            <label class="wf-label wf-sr-only" for="form-newsletter-inline-email">Email address</label>
            <input class="wf-input" id="form-newsletter-inline-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <button class="wf-btn wf-btn--primary" type="submit">Subscribe</button>
        </div>
        <p class="c-form-newsletter-inline__consent">One email a month. Unsubscribe with one click, any time.</p>
      </form>
    </div>
  </div>
</section>
