<section class="wf-section wf-section--tight wf-section--dark c-form-callback-request" data-wf-component="form-callback-request">
  <div class="wf-container c-form-callback-request__grid">
    <div class="c-form-callback-request__copy">
      <h2 class="c-form-callback-request__title">Hate forms? We will call you.</h2>
      <p class="c-form-callback-request__text">Leave a number and a good time. Someone from <span data-wf-field="business.name">AAA Home Specialists</span> calls back within two business hours, no phone tree.</p>
      <p class="c-form-callback-request__direct">
        <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        Or call now: <a href="tel:+14795550100" data-wf-field="business.phone">(479) 555-0100</a>
      </p>
    </div>
    <form class="c-form-callback-request__form" data-wf-form="callback" action="#" method="post">
      <div class="c-form-callback-request__fields">
        <div class="wf-field">
          <label class="wf-label" for="form-callback-request-phone">Your phone number</label>
          <input class="wf-input" id="form-callback-request-phone" name="phone" type="tel" autocomplete="tel" placeholder="(479) 555-0123" required>
        </div>
        <div class="wf-field">
          <label class="wf-label" for="form-callback-request-time">Best time to call</label>
          <select class="wf-select" id="form-callback-request-time" name="best_time">
            <option value="asap">As soon as possible</option>
            <option value="morning">Morning</option>
            <option value="lunch">Around lunch</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">After 5pm</option>
          </select>
        </div>
      </div>
      <button class="wf-btn wf-btn--primary wf-btn--lg wf-btn--block" type="submit">Call me back</button>
    </form>
  </div>
</section>
