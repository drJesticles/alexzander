<section class="wf-section c-form-login-signup" data-wf-component="form-login-signup">
  <div class="wf-container">
    <div class="c-form-login-signup__card">
      <div class="c-form-login-signup__head wf-center">
        <h2 class="c-form-login-signup__title">Customer portal</h2>
        <p class="c-form-login-signup__sub">View invoices, past visits and upcoming appointments with <span data-wf-field="business.name">AAA Home Specialists</span>.</p>
      </div>
      <div class="c-form-login-signup__tabs" role="tablist" aria-label="Sign in or create an account">
        <button class="c-form-login-signup__tab is-active" type="button" role="tab" id="form-login-signup-tab-login" aria-selected="true" aria-controls="form-login-signup-panel-login" data-wf-tab="login">Sign in</button>
        <button class="c-form-login-signup__tab" type="button" role="tab" id="form-login-signup-tab-signup" aria-selected="false" aria-controls="form-login-signup-panel-signup" tabindex="-1" data-wf-tab="signup">Create account</button>
      </div>
      <div class="c-form-login-signup__panel is-active" role="tabpanel" id="form-login-signup-panel-login" aria-labelledby="form-login-signup-tab-login" data-wf-panel="login">
        <form data-wf-form="login" action="#" method="post">
          <div class="wf-field">
            <label class="wf-label" for="form-login-signup-login-email">Email</label>
            <input class="wf-input" id="form-login-signup-login-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="wf-field">
            <label class="wf-label" for="form-login-signup-login-password">Password</label>
            <input class="wf-input" id="form-login-signup-login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="c-form-login-signup__meta">
            <label class="c-form-login-signup__check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
            <a href="#">Forgot password?</a>
          </div>
          <button class="wf-btn wf-btn--primary wf-btn--block" type="submit">Sign in</button>
        </form>
      </div>
      <div class="c-form-login-signup__panel" role="tabpanel" id="form-login-signup-panel-signup" aria-labelledby="form-login-signup-tab-signup" data-wf-panel="signup" hidden>
        <form data-wf-form="signup" action="#" method="post">
          <div class="wf-field">
            <label class="wf-label" for="form-login-signup-signup-name">Full name</label>
            <input class="wf-input" id="form-login-signup-signup-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="wf-field">
            <label class="wf-label" for="form-login-signup-signup-email">Email</label>
            <input class="wf-input" id="form-login-signup-signup-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="wf-field">
            <label class="wf-label" for="form-login-signup-signup-password">Create a password</label>
            <input class="wf-input" id="form-login-signup-signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <p class="c-form-login-signup__hint">At least 8 characters.</p>
          </div>
          <div class="c-form-login-signup__meta">
            <label class="c-form-login-signup__check"><input type="checkbox" name="terms" value="1" required> I agree to the <a href="#">terms of service</a></label>
          </div>
          <button class="wf-btn wf-btn--primary wf-btn--block" type="submit">Create my account</button>
        </form>
      </div>
      <p class="c-form-login-signup__foot wf-center wf-muted">Trouble signing in? Text the office and we will reset it for you.</p>
    </div>
  </div>
</section>
