<section class="wf-section c-form-contact-basic" data-wf-component="form-contact-basic">
  <div class="wf-container wf-container--narrow">
    <div class="c-form-contact-basic__head wf-center">
      <span class="wf-eyebrow">Get in touch</span>
      <h2>Tell us what needs fixing.</h2>
      <p class="wf-lead c-form-contact-basic__lead">Send a quick note and someone from <span data-wf-field="business.name">AAA Home Specialists</span> will reply within one business day. Prefer to talk? Call <a href="tel:+14795550100" data-wf-field="business.phone">(479) 555-0100</a>.</p>
    </div>
    <form class="c-form-contact-basic__form" data-wf-form="contact" action="#" method="post">
      <div class="c-form-contact-basic__row">
        <div class="wf-field">
          <label class="wf-label" for="form-contact-basic-name">Full name</label>
          <input class="wf-input" id="form-contact-basic-name" name="name" type="text" autocomplete="name" placeholder="Jordan Reyes" required>
        </div>
        <div class="wf-field">
          <label class="wf-label" for="form-contact-basic-email">Email</label>
          <input class="wf-input" id="form-contact-basic-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="wf-field">
        <label class="wf-label" for="form-contact-basic-phone">Phone <span class="wf-muted">(optional)</span></label>
        <input class="wf-input" id="form-contact-basic-phone" name="phone" type="tel" autocomplete="tel" placeholder="(479) 555-0123">
      </div>
      <div class="wf-field">
        <label class="wf-label" for="form-contact-basic-message">How can we help?</label>
        <textarea class="wf-textarea" id="form-contact-basic-message" name="message" placeholder="Example: the garbage disposal hums but will not spin, and the kitchen faucet drips." required></textarea>
      </div>
      <div class="c-form-contact-basic__actions">
        <button class="wf-btn wf-btn--primary wf-btn--lg" type="submit">Send message</button>
        <p class="c-form-contact-basic__note">
          <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          We never share your info. No spam, no sales calls.
        </p>
      </div>
    </form>
  </div>
</section>
