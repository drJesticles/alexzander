<section class="wf-section wf-section--surface c-cta-newsletter" data-wf-component="cta-newsletter">
  <div class="wf-container wf-container--narrow c-cta-newsletter__inner">
    <span class="wf-eyebrow">Seasonal reminders</span>
    <h2>One email a month. Gutters in October, furnace filters in January.</h2>
    <p class="c-cta-newsletter__text">The <span data-wf-field="business.name">AAA Home Specialists</span> checklist: what to look at around the house this month, and a first-dibs slot when the schedule opens.</p>
    <form class="c-cta-newsletter__form" action="#" method="post" data-wf-form="newsletter">
      <label class="wf-sr-only" for="cta-newsletter-email">Email address</label>
      <input class="wf-input c-cta-newsletter__input" id="cta-newsletter-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button class="wf-btn wf-btn--primary" type="submit">Send me the checklist</button>
    </form>
    <p class="c-cta-newsletter__fineprint">No sales blasts. Unsubscribe in one click, any time.</p>
  </div>
</section>
