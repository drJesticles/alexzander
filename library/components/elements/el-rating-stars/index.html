      <svg class="wf-icon c-el-rating-stars__star is-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>
      <svg class="wf-icon c-el-rating-stars__star is-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>
      <svg class="wf-icon c-el-rating-stars__star is-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>

    </span>
    <span class="c-el-rating-stars__caption"><strong>4.5</strong> average from 212 reviews on Google</span>

  <form class="c-el-rating-stars__form" action="#" method="post" data-wf-form="review">
    <span class="c-el-rating-stars__prompt" id="el-rating-stars-prompt">How did we do?</span>
    <div class="c-el-rating-stars__picker" role="radiogroup" aria-labelledby="el-rating-stars-prompt">
      <button class="c-el-rating-stars__pick" type="button" role="radio" aria-checked="false" aria-label="1 star" data-wf-value="1" tabindex="0"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></button>
      <button class="c-el-rating-stars__pick" type="button" role="radio" aria-checked="false" aria-label="2 stars" data-wf-value="2" tabindex="-1"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></button>
      <button class="c-el-rating-stars__pick" type="button" role="radio" aria-checked="false" aria-label="3 stars" data-wf-value="3" tabindex="-1"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></button>
      <button class="c-el-rating-stars__pick" type="button" role="radio" aria-checked="false" aria-label="4 stars" data-wf-value="4" tabindex="-1"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></button>
      <button class="c-el-rating-stars__pick" type="button" role="radio" aria-checked="false" aria-label="5 stars" data-wf-value="5" tabindex="-1"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></button>
    </div>
    <input type="hidden" name="rating" value="" class="c-el-rating-stars__value">
    <output class="c-el-rating-stars__output" aria-live="polite">Tap a star to rate</output>
  </form>
</div>
