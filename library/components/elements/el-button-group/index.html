<div class="c-el-button-group" data-wf-component="el-button-group">
  <fieldset class="c-el-button-group__set">
    <legend class="c-el-button-group__legend">What kind of property?</legend>
    <div class="c-el-button-group__segments">
      <input class="c-el-button-group__input" type="radio" name="el-button-group-property" id="el-button-group-res" value="residential" checked>
      <label class="c-el-button-group__segment" for="el-button-group-res">Residential</label>
      <input class="c-el-button-group__input" type="radio" name="el-button-group-property" id="el-button-group-com" value="commercial">
      <label class="c-el-button-group__segment" for="el-button-group-com">Commercial</label>
      <input class="c-el-button-group__input" type="radio" name="el-button-group-property" id="el-button-group-rental" value="rental">
      <label class="c-el-button-group__segment" for="el-button-group-rental">Rental</label>
    </div>
  </fieldset>
</div>
