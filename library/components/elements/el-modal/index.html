<div class="c-el-modal" data-wf-component="el-modal">
  <button class="wf-btn wf-btn--primary c-el-modal__trigger" type="button" aria-haspopup="dialog" aria-expanded="false">Request a free quote</button>
  <div class="c-el-modal__overlay" hidden>
    <div class="c-el-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="el-modal-title" tabindex="-1">
      <div class="c-el-modal__head">
        <h3 class="c-el-modal__title" id="el-modal-title">Tell us about the job</h3>
        <button class="c-el-modal__close" type="button" aria-label="Close dialog" data-wf-close>
          <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="c-el-modal__lead">A few details and <span data-wf-field="business.name">AAA Home Specialists</span> will call you back within one business day.</p>
      <form class="c-el-modal__form" action="#" method="post" data-wf-form="quote">
        <div class="wf-field">
          <label class="wf-label" for="el-modal-name">Your name</label>
          <input class="wf-input" id="el-modal-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="wf-field">
          <label class="wf-label" for="el-modal-phone">Phone</label>
          <input class="wf-input" id="el-modal-phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="wf-field">
          <label class="wf-label" for="el-modal-job">What needs doing?</label>
          <textarea class="wf-textarea" id="el-modal-job" name="message" rows="3" placeholder="Leaky faucet in the hall bath, a couple doors that stick..."></textarea>
        </div>
        <div class="c-el-modal__actions">
          <button class="wf-btn wf-btn--ghost" type="button" data-wf-close>Cancel</button>
          <button class="wf-btn wf-btn--primary" type="submit">Send request</button>
        </div>
      </form>
    </div>
  </div>
</div>
