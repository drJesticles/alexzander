<div class="c-el-toast" data-wf-component="el-toast">
  <button class="wf-btn wf-btn--primary c-el-toast__trigger" type="button">Save my appointment</button>
  <div class="c-el-toast__region" aria-live="polite" aria-atomic="true">
    <div class="c-el-toast__toast" role="status" hidden>
      <svg class="wf-icon c-el-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
      <div class="c-el-toast__body">
        <strong class="c-el-toast__title">Appointment saved</strong>
        <span class="c-el-toast__text">Thursday at 9 am. We will text you a reminder the night before.</span>
      </div>
      <button class="c-el-toast__close" type="button" aria-label="Dismiss notification">
        <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
</div>
