<section class="wf-section c-gallery-lightbox" data-wf-component="gallery-lightbox">
  <div class="wf-container">
    <div class="c-gallery-lightbox__head">
      <span class="wf-eyebrow">Bathroom remodels</span>
      <h2>Tap any photo to see it full size.</h2>
    </div>
    <div class="c-gallery-lightbox__grid">
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/master-bath-after.svg" data-wf-caption="Master bath after: double vanity, frameless glass shower">
        <img src="/ph/600/400/master-bath-after.svg" alt="Master bath with double vanity and frameless glass shower" width="600" height="400">
      </button>
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/hall-bath-tub-surround.svg" data-wf-caption="Hall bath: new tub surround in white subway tile">
        <img src="/ph/600/400/hall-bath-tub-surround.svg" alt="Hall bath tub surround in white subway tile" width="600" height="400">
      </button>
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/curbless-shower.svg" data-wf-caption="Curbless shower with linear drain for aging in place">
        <img src="/ph/600/400/curbless-shower.svg" alt="Curbless walk-in shower with linear drain" width="600" height="400">
      </button>
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/floating-vanity.svg" data-wf-caption="Floating walnut vanity with under-cabinet lighting">
        <img src="/ph/600/400/floating-vanity.svg" alt="Floating walnut vanity with lighting underneath" width="600" height="400">
      </button>
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/penny-tile-floor.svg" data-wf-caption="Black and white penny tile floor, laid by hand">
        <img src="/ph/600/400/penny-tile-floor.svg" alt="Black and white penny tile bathroom floor" width="600" height="400">
      </button>
      <button class="c-gallery-lightbox__thumb" type="button" data-wf-full="/ph/1600/1067/half-bath-wallpaper.svg" data-wf-caption="Half bath with bold wallpaper and pedestal sink">
        <img src="/ph/600/400/half-bath-wallpaper.svg" alt="Half bath with patterned wallpaper and pedestal sink" width="600" height="400">
      </button>
    </div>
  </div>
  <div class="c-gallery-lightbox__overlay" data-wf-overlay role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="c-gallery-lightbox__close" type="button" data-wf-close aria-label="Close photo viewer">
      <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="c-gallery-lightbox__arrow c-gallery-lightbox__arrow--prev" type="button" data-wf-prev aria-label="Previous photo">
      <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="c-gallery-lightbox__stage">
      <img class="c-gallery-lightbox__full" data-wf-image src="/ph/1600/1067/master-bath-after.svg" alt="" width="1600" height="1067">
      <figcaption class="c-gallery-lightbox__meta">
        <span data-wf-caption-out>Master bath after: double vanity, frameless glass shower</span>
        <span class="c-gallery-lightbox__counter" data-wf-counter>1 / 6</span>
      </figcaption>
    </figure>
    <button class="c-gallery-lightbox__arrow c-gallery-lightbox__arrow--next" type="button" data-wf-next aria-label="Next photo">
      <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</section>
