<section class="wf-section wf-section--surface c-stats-counter" data-wf-component="stats-counter">
  <div class="wf-container">
    <div class="wf-center c-stats-counter__head">
      <span class="wf-eyebrow">Track record</span>
      <h2>Twenty-two years, one zip code at a time.</h2>
      <p class="wf-lead">Numbers from <span data-wf-field="business.name">AAA Home Specialists</span> job logs, updated every January.</p>
    </div>
    <dl class="c-stats-counter__grid">
      <div class="wf-card c-stats-counter__item">
        <dd class="c-stats-counter__value"><span class="c-stats-counter__num" data-count="1400" data-suffix="+">1,400+</span></dd>
        <dt>Jobs completed since 2004</dt>
      </div>
      <div class="wf-card c-stats-counter__item">
        <dd class="c-stats-counter__value"><span class="c-stats-counter__num" data-count="180" data-suffix="">180</span></dd>
        <dt>Five-star reviews on record</dt>
      </div>
      <div class="wf-card c-stats-counter__item">
        <dd class="c-stats-counter__value"><span class="c-stats-counter__num" data-count="98" data-suffix="%">98%</span></dd>
        <dt>Jobs finished on the quoted day</dt>
      </div>
    </dl>
  </div>
</section>
