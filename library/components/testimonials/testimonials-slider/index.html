<section class="wf-section wf-section--surface c-testimonials-slider" data-wf-component="testimonials-slider">
  <div class="wf-container wf-container--narrow">
    <div class="wf-center c-testimonials-slider__head">
      <span class="wf-eyebrow">Reviews</span>
      <h2>Neighbors, in their own words.</h2>
    </div>
    <div class="c-testimonials-slider__viewport" aria-roledescription="carousel" aria-label="Customer reviews">
      <div class="c-testimonials-slider__track" aria-live="polite">
        <figure class="c-testimonials-slider__slide is-active" aria-roledescription="slide" aria-label="1 of 3">
          <span class="c-testimonials-slider__stars" role="img" aria-label="Rated 5 out of 5 stars"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></span>
          <blockquote class="c-testimonials-slider__quote"><p>We had three other outfits no-show on a bathroom exhaust fan. These guys showed up at 8:02, finished by 9:30, and the bathroom mirror has not fogged since.</p></blockquote>
          <figcaption class="c-testimonials-slider__who"><strong>Keisha W.</strong><span>Russellville</span></figcaption>
        </figure>
        <figure class="c-testimonials-slider__slide" aria-roledescription="slide" aria-label="2 of 3" hidden>
          <span class="c-testimonials-slider__stars" role="img" aria-label="Rated 5 out of 5 stars"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></span>
          <blockquote class="c-testimonials-slider__quote"><p>Rebuilt the back steps on our rental in one day and sent photos before and after so I did not have to drive over from Conway. Invoice was exactly the quote.</p></blockquote>
          <figcaption class="c-testimonials-slider__who"><strong>Tom B.</strong><span>Landlord, Pottsville</span></figcaption>
        </figure>
        <figure class="c-testimonials-slider__slide" aria-roledescription="slide" aria-label="3 of 3" hidden>
          <span class="c-testimonials-slider__stars" role="img" aria-label="Rated 5 out of 5 stars"><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><svg class="wf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg></span>
          <blockquote class="c-testimonials-slider__quote"><p>Patient with my 84-year-old dad, explained every step, and set up the new smart thermostat so he can actually use it. That is worth more than the price.</p></blockquote>
          <figcaption class="c-testimonials-slider__who"><strong>Lindsey H.</strong><span>Dover</span></figcaption>
        </figure>
      </div>
      <div class="c-testimonials-slider__controls">
        <button class="c-testimonials-slider__btn" type="button" data-dir="-1" aria-label="Previous review">
          <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="c-testimonials-slider__dots" role="tablist" aria-label="Choose review">
          <button class="c-testimonials-slider__dot is-active" type="button" role="tab" aria-selected="true" aria-label="Review 1"></button>
          <button class="c-testimonials-slider__dot" type="button" role="tab" aria-selected="false" aria-label="Review 2"></button>
          <button class="c-testimonials-slider__dot" type="button" role="tab" aria-selected="false" aria-label="Review 3"></button>
        </div>
        <button class="c-testimonials-slider__btn" type="button" data-dir="1" aria-label="Next review">
          <svg class="wf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
